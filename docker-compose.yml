services:
  # ── Database ──────────────────────────────────────────────
  medi-db:
    image: mysql:8.0
    container_name: medi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: medi
      MYSQL_USER: medi
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - medi-data:/var/lib/mysql
    networks:
      - medi-net
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend (Laravel API) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medi-backend
    restart: always
    environment:
      APP_NAME: Medi
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:3000
      APP_KEY: base64:xUMHB3UVKAp7JnoJCgj7/MZObIJpfwP8vembaR+9BEU=
      DB_CONNECTION: mysql
      DB_HOST: medi-db
      DB_PORT: 3306
      DB_DATABASE: medi
      DB_USERNAME: medi
      DB_PASSWORD: root
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    depends_on:
      medi-db:
        condition: service_healthy
    networks:
      - medi-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # ── Frontend (React + Vite) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medi-frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:8001/api
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medi-net
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  medi-data:
  backend-vendor:

networks:
  medi-net:
    driver: bridge
